[package]
name = "lb-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = { version = "1.6", features = ["serde"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
h2 = "0.3.27"
http = "0.2"
http1 = { package = "http", version = "1" }
httpdate = "1.0"
ipnet = "2.10"
jsonwebtoken = "9.3"
lb-config-model = { path = "../config-model" }
lb-net-core = { path = "../net-core" }
lb-observability = { path = "../observability" }
lb-proto-http = { path = "../proto-http" }
lb-proto-tls = { path = "../proto-tls" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
quinn = "0.11.9"
rustls = "0.23"
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
webpki-roots = "1.0"

[dev-dependencies]
bytes = { version = "1.6", features = ["serde"] }
criterion = { version = "0.5", features = ["html_reports"] }
h2 = "0.3.27"
http = "0.2"
httpdate = "1.0"
lb-config-model = { path = "../config-model" }
lb-test-support = { path = "../test-support" }
proptest = "1.5"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"

[[bench]]
name = "http_cache"
harness = false

[[bench]]
name = "dataplane_envelope"
harness = false

[lints]
workspace = true
