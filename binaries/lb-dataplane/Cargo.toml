[package]
name = "lb-dataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.10"
h2 = "0.3.27"
http = "0.2"
http1 = { package = "http", version = "1" }
ipnet = "2.10"
h3 = "0.0.8"
h3-quinn = "0.0.10"
lb-admin-api = { path = "../../crates/admin-api" }
lb-config-model = { path = "../../crates/config-model" }
lb-runtime = { path = "../../crates/runtime" }
lb-net-core = { path = "../../crates/net-core" }
lb-proto-http = { path = "../../crates/proto-http" }
lb-proto-tls = { path = "../../crates/proto-tls" }
lb-observability = { path = "../../crates/observability" }
rustls = "0.23"
quinn = "0.11.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
lb-test-support = { path = "../../crates/test-support" }
rcgen = "0.13"

[lints]
workspace = true
